<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Accès préproduction – Yann Quillevere</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#F0EEEB;
       font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2B2B2B}
  .box{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:40px 32px;box-shadow:0 24px 60px -30px rgba(0,0,0,.35)}
  .logo{display:flex;flex-direction:column;align-items:center;color:#B8553A;line-height:1;margin-bottom:26px}
  .logo small{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .logo strong{font-size:1.5rem;font-weight:500;text-transform:uppercase;margin:4px 0 6px}
  .logo span{font-size:.6rem;letter-spacing:.5em;text-transform:uppercase;padding-left:.5em}
  h1{font-size:1.05rem;font-weight:600;text-align:center;margin:0 0 6px;color:#111}
  p{font-size:.85rem;color:#666;text-align:center;margin:0 0 24px}
  label{display:block;font-size:.82rem;margin:0 0 6px;color:#111}
  input{width:100%;padding:13px 16px;border:1px solid #E0DDD8;border-radius:12px;font:inherit;font-size:1rem;margin-bottom:16px}
  input:focus{outline:none;border-color:#B8553A}
  button{width:100%;padding:14px;border:0;border-radius:999px;background:#B8553A;color:#fff;font:inherit;font-size:.95rem;cursor:pointer}
  button:hover{background:#96432C}
  button:disabled{opacity:.6;cursor:wait}
  .remember{display:flex;gap:8px;align-items:center;font-size:.82rem;color:#666;margin:-4px 0 20px}
  .remember input{width:auto;margin:0;accent-color:#B8553A}
  .auto .box{visibility:hidden}
  .err{color:#B3261E;font-size:.85rem;text-align:center;min-height:1.2em;margin:14px 0 0}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="logo"><small>Yann</small><strong>Quillevere</strong><span>Avocat</span></div>
  <h1>Accès préproduction</h1>
  <p>Site en cours de réalisation, accès réservé.</p>
  <label for="u">Identifiant</label>
  <input id="u" name="username" autocomplete="username" required>
  <label for="p">Mot de passe</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <label class="remember"><input type="checkbox" id="r" checked> Rester connecté sur cet appareil</label>
  <button id="b" type="submit">Accéder</button>
  <div class="err" id="e" role="alert"></div>
</form>
